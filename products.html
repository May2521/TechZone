<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="สินค้า TechZone">
    <title>Products - TechZone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header"><div class="container header-inner">
    <a href="index.html" class="brand-logo" aria-label="TechZone IT Solutions">
    <img src="assets/logo/techzone-logo-transparent.png" alt="TechZone IT Solutions">
</a>
    <nav aria-label="Main navigation"><ul class="nav-list"><li><a href="index.html">หน้าแรก</a></li><li><a class="active" href="products.html">สินค้า</a></li><li><a href="index.html#about">เกี่ยวกับเรา</a></li><li><a href="index.html#contact">ติดต่อเรา</a></li></ul></nav>
    <div class="header-actions">
        <div class="auth-area"></div>
        <a class="cart-link" href="#cart">🛒 <span id="cartBadge" class="cart-badge">0</span></a>
    </div>
</div></header>
<main>
<section class="page-hero"><div class="container"><span class="eyebrow">TECHZONE PRODUCTS</span><h1>สินค้าไอทีและ Gaming Gear</h1><p>ค้นหาสินค้าทั้ง 11 รายการได้ทันที</p></div></section>
<section class="section-spacing"><div class="container">
    <div class="catalog-toolbar">
        <label class="search-box"><span class="sr-only">ค้นหาสินค้า</span><input id="searchInput" type="search" placeholder="ค้นหาชื่อสินค้า..." autocomplete="off"></label>
        <label><span class="sr-only">เรียงราคา</span><select id="sortSelect"><option value="default">เรียงตามค่าเริ่มต้น</option><option value="price-low">ราคาต่ำ → สูง</option><option value="price-high">ราคาสูง → ต่ำ</option></select></label>
    </div>
    <p id="productCount" class="result-count"></p>
    <div id="productGrid" class="product-grid"></div>
</div></section>
<section id="cart" class="section-spacing cart-section"><div class="container"><div class="section-heading"><div><span class="eyebrow">YOUR CART</span><h2>ตะกร้าสินค้า</h2></div></div><div id="cartItems" class="cart-list"></div><div class="cart-summary"><strong>รวมทั้งหมด: <span id="cartTotal">0 THB</span></strong><button id="checkoutButton" class="button button-accent" type="button">สั่งซื้อ</button></div></div></section>
</main>
<footer class="site-footer"><div class="container footer-inner"><div><a class="footer-brand" href="index.html"><img src="assets/logo/techzone-logo-transparent.png" alt="TechZone"></a><p>Computer & Gaming Store</p></div><p>&copy; 2026 TechZone. All Rights Reserved.</p></div></footer>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="script.js" defer></script>
</body>
</html>
